<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Richiesta ricevuta | NPS Apnea</title>
    {% include "includes/public_styles.html" %}
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'homepage' %}" aria-label="NPS Apnea, home">
            <span class="brand-mark" aria-hidden="true">NPS</span>
            <span>NPS Apnea <span class="brand-caption">Richiesta informazioni</span></span>
        </a>
    </header>
    <main class="page">
        <section class="auth-card" aria-labelledby="confirmation-title">
            <h1 id="confirmation-title">Richiesta ricevuta</h1>
            {% if messages %}
                {% for message in messages %}
                    <p role="status">{{ message }}</p>
                {% endfor %}
            {% else %}
                <p>La richiesta è stata registrata. Grazie per averci contattato.</p>
            {% endif %}
            <a class="button-link" href="{% url 'homepage' %}">Torna alla home</a>
        </section>
    </main>
</body>
</html>
