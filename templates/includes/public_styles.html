<style>
    :root {
        color-scheme: light;
        --ink: #14324b;
        --muted: #62768a;
        --line: #e2eaf0;
        --surface: #fff;
        --canvas: #f3f7fa;
        --teal: #087f82;
        --teal-dark: #06676a;
        --shadow: 0 12px 32px rgba(20, 50, 75, .07);
    }

    * { box-sizing: border-box; }

    body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.55;
    }

    a { color: var(--teal-dark); }
    a:focus-visible, button:focus-visible, input:focus-visible {
        outline: 3px solid #53c5c1;
        outline-offset: 3px;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 76px;
        padding: 14px max(24px, calc((100% - 1120px) / 2));
        background: var(--surface);
        border-bottom: 1px solid var(--line);
    }

    .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--ink);
        font-weight: 750;
        letter-spacing: .04em;
        text-decoration: none;
    }

    .brand-mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        color: #fff;
        background: var(--teal);
        border-radius: 13px;
        font-size: 13px;
        letter-spacing: .03em;
    }

    .brand-caption {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
    }

    .topbar-link {
        color: var(--teal-dark);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
    }

    .topbar-link:hover, .text-link:hover { text-decoration: underline; }

    .page {
        width: min(1120px, calc(100% - 40px));
        margin: 42px auto 64px;
    }

    .welcome {
        position: relative;
        overflow: hidden;
        padding: clamp(30px, 5vw, 52px);
        color: #fff;
        background: linear-gradient(118deg, #103750 0%, #12576a 58%, var(--teal) 100%);
        border-radius: 22px;
        box-shadow: var(--shadow);
    }

    .welcome::after {
        position: absolute;
        top: -110px;
        right: -40px;
        width: 300px;
        height: 300px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 50%;
        box-shadow: 0 0 0 36px rgba(255,255,255,.035), 0 0 0 72px rgba(255,255,255,.025);
        content: "";
        pointer-events: none;
    }

    .welcome-content { position: relative; z-index: 1; }
    .eyebrow {
        margin: 0 0 8px;
        color: #a9e3df;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .13em;
        text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(28px, 4vw, 38px); line-height: 1.2; }

    .welcome-copy {
        max-width: 570px;
        margin-bottom: 0;
        color: rgba(255,255,255,.8);
    }

    .auth-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, .82fr);
        align-items: center;
        gap: clamp(28px, 6vw, 76px);
        max-width: 960px;
        margin: 50px auto 0;
    }

    .auth-intro h1 { margin-bottom: 12px; }
    .auth-intro p { max-width: 440px; margin-bottom: 0; color: var(--muted); }
    .auth-card {
        padding: clamp(24px, 4vw, 34px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
    }

    .auth-card h2 { margin-bottom: 6px; font-size: 21px; }
    .auth-caption { margin-bottom: 22px; color: var(--muted); font-size: 13px; }

    .auth-form p { margin: 0 0 16px; }
    .auth-form label {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 650;
    }

    .auth-form input {
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        color: var(--ink);
        background: #fff;
        border: 1px solid #ccd9e2;
        border-radius: 9px;
        font: inherit;
        transition: border-color .2s, box-shadow .2s;
    }

    .auth-form input[type="checkbox"] {
        display: inline-block;
        width: 18px;
        min-height: 18px;
        margin: 0 8px 0 0;
        vertical-align: middle;
        accent-color: var(--teal);
    }

    .auth-form label:has(input[type="checkbox"]) {
        display: flex;
        align-items: flex-start;
        gap: 2px;
    }

    .auth-form input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(8,127,130,.12);
        outline: none;
    }

    .auth-form ul, .auth-form .errorlist {
        margin: 6px 0 0;
        padding-left: 18px;
        color: #a63737;
        font-size: 12px;
    }

    .auth-form .helptext {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
    }

    .form-errors {
        margin: 0 0 16px;
        padding: 12px 14px;
        color: #963838;
        background: #fff0ef;
        border-radius: 10px;
        font-size: 13px;
    }

    .form-warning {
        margin: 0 0 16px;
        padding: 12px 14px;
        color: #825016;
        background: #fff3dc;
        border-radius: 10px;
        font-size: 13px;
    }

    .primary-button, .button-link {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 44px;
        padding: 10px 16px;
        color: #fff;
        background: var(--teal);
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        transition: background .2s, transform .2s;
    }

    .primary-button:hover, .button-link:hover {
        color: #fff;
        background: var(--teal-dark);
        transform: translateY(-1px);
    }

    .auth-form .primary-button { width: 100%; margin-top: 2px; }
    .auth-switch { margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    .text-link { color: var(--teal-dark); font-weight: 700; text-decoration: none; }
    .footer-note { margin: 30px 0 0; color: var(--muted); font-size: 12px; text-align: center; }

    .home-content { max-width: 680px; }
    .home-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .button-secondary {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 44px;
        padding: 10px 16px;
        color: #fff;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.4);
        border-radius: 9px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: background .2s;
    }

    .button-secondary:hover { color: #fff; background: rgba(255,255,255,.2); }
    .home-card {
        max-width: 680px;
        margin: 20px auto 0;
        padding: 22px 26px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
    }

    .home-card p { margin-bottom: 0; color: var(--muted); }
    .logout-form { display: inline-flex; margin: 0; }
    .logout-button {
        min-height: 44px;
        padding: 10px 16px;
        color: #fff;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.4);
        border-radius: 9px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
    }

    .logout-button:hover { background: rgba(255,255,255,.2); }

    @media (max-width: 720px) {
        .topbar { min-height: 68px; padding: 12px 20px; }
        .page { width: min(100% - 28px, 540px); margin-top: 24px; }
        .auth-layout { grid-template-columns: 1fr; gap: 22px; margin-top: 28px; }
        .auth-intro { padding: 0 4px; }
    }

    @media (max-width: 420px) {
        .brand-caption { display: none; }
        .welcome { border-radius: 17px; }
        .home-actions { flex-direction: column; }
        .home-actions > * { width: 100%; }
    }
</style>
